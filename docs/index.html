<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050a12"><meta name="description" content="Vanadis 的个人主页 · Less is More"><title>Vanadis · Less is More</title><link rel="icon" href="./favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a12;color:#f1f4f8}body{font-family:'Italiana','Noto Serif SC',Georgia,serif;min-width:900px}.sky{position:fixed;inset:0;background:url('./assets/starfield.jpg') center/cover no-repeat;transition:transform 1.8s ease,filter 1.8s ease}.sky:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,13,.40),rgba(2,6,13,.17)),linear-gradient(0deg,rgba(2,6,13,.48),rgba(2,6,13,.2));backdrop-filter:saturate(.65)}body.expanded .sky{transform:scale(1.035);filter:brightness(.78)}main{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px}.identity{width:800px;animation:reveal 1.6s ease-out both}.name{font:400 clamp(110px,11.5vw,185px)/1.1 'Italiana',Georgia,serif;letter-spacing:.025em;margin:0;transition:font-size 1.1s cubic-bezier(.22,1,.36,1)}.motto{margin:24px 0 0;font-size:11px;font-weight:400;letter-spacing:.48em;color:rgba(231,240,252,.62);padding-left:.48em}.intro-toggle{border:0;background:none;color:inherit;padding:0;cursor:pointer}.intro-toggle:focus-visible,button:focus-visible,a:focus-visible{outline:1px solid #c3dced;outline-offset:8px}.hint{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);font:10px 'Noto Serif SC',serif;letter-spacing:.28em;color:#c2cddc70;transition:opacity .5s;pointer-events:none}.expanded .hint{opacity:0}.panel{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(20px);transition:grid-template-rows 1.1s cubic-bezier(.22,1,.36,1),opacity .8s ease,transform 1.1s ease}.panel-inner{overflow:hidden}.expanded .panel{grid-template-rows:1fr;opacity:1;transform:translateY(0);transition-delay:.1s}.expanded .name{font-size:90px}.bio{padding-top:37px;font-family:'Noto Serif SC',serif;font-weight:300}.bio h2{font-size:18px;font-weight:300;letter-spacing:.17em;margin:0 0 17px}.bio p{font-size:12px;color:#b7c3d3;letter-spacing:.12em;line-height:2.3;margin:0}.quote-area{margin:34px auto 0;padding-top:25px;position:relative}.quote-area:before{content:'';position:absolute;top:0;left:calc(50% - 18px);width:36px;height:1px;background:#b5c9df40}blockquote{font-size:26px;font-weight:300;margin:0;line-height:1.5;color:#e1e8f0}cite{display:block;font:9px 'Noto Serif SC',serif;color:#8493a7;letter-spacing:.15em;margin-top:12px;font-style:normal}.quote-controls{display:flex;justify-content:center;gap:10px;margin-top:21px}.quote-controls button{width:18px;height:18px;border:0;padding:6px;background:transparent;cursor:pointer}.quote-controls button:after{content:'';display:block;height:4px;width:4px;border-radius:50%;background:#8194ab65;transition:background .3s}.quote-controls button[aria-pressed=true]:after{background:#d6e3f3}.close{margin-top:25px;border:0;background:transparent;color:#91a2b8;font:10px 'Noto Serif SC',serif;letter-spacing:.2em;cursor:pointer;padding:8px}.github{position:fixed;right:55px;bottom:38px;color:rgba(231,240,252,.56);text-decoration:none;font:11px Georgia,serif;letter-spacing:.13em;padding:10px 0;transition:color .2s}.github:hover,.close:hover{color:#fff}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="sky" aria-hidden="true"></div><main><div class="identity"><button class="intro-toggle" aria-expanded="false" aria-controls="introduction" aria-label="展开个人介绍"><h1 class="name">Vanadis</h1><p class="motto">LESS IS MORE</p></button><section class="panel" id="introduction" aria-label="个人介绍" inert><div class="panel-inner"><div class="bio"><h2>你好，我是 Vanadis。</h2><p>欢迎来到我的小小宇宙。<br>喜欢简单，保持好奇。愿日子自由，心中有光。</p></div><div class="quote-area"><blockquote id="quote">I had Mr. Mozart to keep me company.</blockquote><cite>— 《肖申克的救赎》 · 1994</cite></div><button class="close" type="button">收起 ↑</button></div></section></div></main><span class="hint" aria-hidden="true">点击任意留白 · 认识我</span><a class="github" href="https://github.com/vanadisgithub" target="_blank" rel="noopener noreferrer" aria-label="访问 Vanadis 的 GitHub">GITHUB ↗</a>
<script>
const toggle=document.querySelector('.intro-toggle'),panel=document.querySelector('.panel');
function setExpanded(open){document.body.classList.toggle('expanded',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'收起个人介绍':'展开个人介绍');panel.inert=!open;}
toggle.addEventListener('click',()=>setExpanded(!document.body.classList.contains('expanded')));
document.addEventListener('click',e=>{if(!e.target.closest('a,button,.panel')&&!document.body.classList.contains('expanded'))setExpanded(true);});
document.querySelector('.close').addEventListener('click',()=>{setExpanded(false);toggle.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('expanded')){setExpanded(false);toggle.focus({preventScroll:true});}});
</script></body></html>
