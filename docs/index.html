<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a12">
<meta name="description" content="Vanadis 的个人主页 · Less is More">
<title>Vanadis · Less is More</title>
<link rel="icon" href="./favicon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050a12;color:#f1f4f8}body{font-family:Manrope,'Helvetica Neue',sans-serif;min-width:900px}.sky{position:fixed;inset:0;background:url('./assets/starfield.jpg') center/cover no-repeat}.sky:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,13,.40),rgba(2,6,13,.17)),linear-gradient(0deg,rgba(2,6,13,.48),rgba(2,6,13,.2));backdrop-filter:saturate(.65)}main{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.identity{margin-top:-20px;animation:reveal 1.6s ease-out both}h1{font-weight:400;font-size:clamp(100px,10.5vw,170px);letter-spacing:-.055em;line-height:1.2;margin:0}p{margin:24px 0 0;font-size:11px;font-weight:400;letter-spacing:.46em;color:rgba(231,240,252,.62);padding-left:.46em}.github{position:fixed;right:55px;bottom:38px;color:rgba(231,240,252,.56);text-decoration:none;font-size:11px;letter-spacing:.13em;padding:10px 0;transition:color .2s}.github:hover{color:#fff}.github:focus-visible{outline:1px solid #c3dced;outline-offset:8px}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.identity{animation:none}}
</style>
</head>
<body><div class="sky" aria-hidden="true"></div><main><div class="identity"><h1>Vanadis</h1><p>LESS IS MORE</p></div></main><a class="github" href="https://github.com/vanadisgithub" target="_blank" rel="noopener noreferrer" aria-label="访问 Vanadis 的 GitHub">GITHUB ↗</a></body>
</html>
