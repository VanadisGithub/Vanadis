<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050a12"><meta name="description" content="Vanadis 的个人主页 · Less is More"><title>Vanadis · Less is More</title><link rel="icon" href="./favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Allura&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}html,body{margin:0;background:#06080c;color:#f1f4f8}body{min-width:900px;font-family:'Noto Serif SC',serif}
.sky{position:fixed;inset:15vh 11vw;display:grid;grid-template-columns:repeat(4,1fr);gap:26px;align-items:center;transition:filter 1.8s ease}.window{position:relative;height:100%;transform-origin:center;transform:perspective(1000px) translateZ(var(--depth-z,0px)) rotateY(var(--angle,-27deg));overflow:hidden;background:#080e19;border:0;box-shadow:0 18px 50px rgba(0,0,0,.18)}.window:before{content:'';position:absolute;top:-10vh;bottom:-10vh;width:100vw;background:url('./assets/milkyway-eso.jpg') center/cover no-repeat;filter:saturate(.85);transition:transform 1.8s ease}.window{justify-self:center;width:100%;left:var(--spacing-x,0px)}.window:nth-child(2){filter:brightness(.98)}.window:nth-child(3){filter:brightness(.95)}.window:nth-child(4){filter:brightness(.92);transform:perspective(1000px) translateZ(var(--depth-z,0px));clip-path:polygon(0 var(--trim,5%),100% 0,100% 100%,0 calc(100% - var(--trim,5%)))}.window:before{left:var(--image-x,-11vw);top:var(--image-y,-15vh);bottom:auto;height:100vh}.window:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(3,19,42,.30),rgba(3,12,31,.38));mix-blend-mode:normal}
.sky{pointer-events:none;filter:brightness(var(--brightness,1));transition:none}.window:before{transition:none}main{position:relative}.page{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px}.content{width:min(850px,80vw)}.name{font:400 clamp(130px,13vw,205px)/1.1 'Allura',cursive;margin:0}.motto{font:11px 'Italiana',serif;letter-spacing:.48em;color:#d7e1ef9e;margin:24px 0 0}.label{font:10px 'Italiana',serif;letter-spacing:.35em;color:#a5b6cd;margin-bottom:38px}.bio h2{font-size:28px;font-weight:300;letter-spacing:.14em;margin:0 0 28px}.bio p{font-size:14px;font-weight:300;letter-spacing:.12em;line-height:2.6;color:#b7c3d3;margin:0}blockquote{font:400 clamp(38px,4vw,64px)/1.5 'Allura',cursive;color:#e1e8f0;margin:0}cite{display:block;font:10px 'Noto Serif SC',serif;color:#8493a7;letter-spacing:.15em;margin-top:30px;font-style:normal}.github{position:fixed;right:55px;bottom:38px;color:#e7f0fc8f;text-decoration:none;font:11px Georgia,serif;letter-spacing:.13em;padding:10px 0}.github:hover{color:white}a:focus-visible{outline:1px solid #c3dced;outline-offset:8px}.hint{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.25em;color:#c2cddc70}.page{position:relative}.pages{position:fixed;left:45px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:20px}.pages a{display:block;width:5px;height:5px;border-radius:50%;background:#c9d7e73d}.pages a[aria-current=true]{background:#d9e7f8;box-shadow:0 0 12px #c9d7e740}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.photo-credit{position:fixed;left:45px;bottom:46px;font:10px Georgia,serif;letter-spacing:.04em;color:#9baabd;text-decoration:none}.photo-credit:hover{color:#fff}</style></head><body><div class="sky" aria-hidden="true"><div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div></div>
<main><section class="page" id="home" aria-label="首页"><div class="content"><h1 class="name">Vanadis</h1><p class="motto">LESS IS MORE</p></div><span class="hint">向上滑动 · 认识我</span></section>
<section class="page" id="about" aria-label="个人介绍"><div class="content bio"><div class="label">ABOUT ME</div><h2>你好，我是 Vanadis。</h2><p>喜欢简单，保持好奇。<br>愿日子自由，心中有光。</p></div><span class="hint">继续滑动 ↓</span></section>
<section class="page" id="cinema" aria-label="电影台词"><div class="content"><blockquote>I had Mr. Mozart to keep me company.</blockquote><cite>— 《肖申克的救赎》 · 1994</cite></div></section></main>
<nav class="pages" aria-label="页面导航"><a href="#home" aria-label="首页" aria-current="true"></a><a href="#about" aria-label="个人介绍" aria-current="false"></a><a href="#cinema" aria-label="电影台词" aria-current="false"></a></nav><a class="github" href="https://github.com/vanadisgithub" target="_blank" rel="noopener noreferrer">GITHUB ↗</a>
<a class="photo-credit" href="https://www.eso.org/public/images/eso0932a/" target="_blank" rel="noopener noreferrer">ESO/S. Brunier</a><script>
const root=document.documentElement,links=[...document.querySelectorAll('.pages a')];let scheduled=false;
const windows=[...document.querySelectorAll('.window')];
function updateScene(){
 const progress=Math.min(1,Math.max(0,scrollY/(innerHeight*2)));
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const motion=reduced?0:progress;
 const flatten=motion*motion*(3-2*motion);
 root.style.setProperty('--depth-z',(-motion*420)+'px');
 root.style.setProperty('--angle',(-27*(1-flatten))+'deg');
 root.style.setProperty('--trim',(5*(1-flatten))+'%');
 root.style.setProperty('--brightness',String(1-progress*.1));
 const heights=[1,.86,.73,.62],widths=[1.14,1.04,.95,.87];
 const sky=document.querySelector('.sky');
 windows.forEach((w,i)=>{w.style.height=((heights[i]+(.82-heights[i])*flatten)*100)+'%';w.style.width=((widths[i]+(1-widths[i])*flatten)*100)+'%';});
 // Equalize the visible gaps after perspective projection, rather than the grid cells.
 windows.forEach(w=>w.style.setProperty('--spacing-x','0px'));
 const boxes=windows.map(w=>w.getBoundingClientRect());
 const total=boxes[3].right-boxes[0].left;
 const gap=(total-boxes.reduce((sum,r)=>sum+r.width,0))/3;
 let edge=innerWidth/2-total/2;
 windows.forEach((w,i)=>{w.style.setProperty('--spacing-x',(edge-boxes[i].left)+'px');edge+=boxes[i].width+gap;});
 windows.forEach(w=>{w.style.setProperty('--image-x',(-(sky.offsetLeft+w.offsetLeft))+'px');w.style.setProperty('--image-y',(-(sky.offsetTop+w.offsetTop))+'px');});
 const current=Math.round(scrollY/innerHeight);links.forEach((a,i)=>a.setAttribute('aria-current',String(i===current)));scheduled=false;
}
addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(updateScene);}},{passive:true});addEventListener('resize',updateScene);updateScene();
</script></body></html>
